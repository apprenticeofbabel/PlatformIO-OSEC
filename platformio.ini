; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
include_dir = include


[env:stm8s105c6t6]
platform = ststm8
board = stm8s105c6t6
;framework = spl ; Not needed. Using local spl files
upload_protocol = stlinkv2

platform_packages =
    toolchain-sdcc@1.40100.* ; Restrict SDCC package to version 4.1.0

build_flags =
    --std-c99
    -mstm8
    --nolospre
    -I include
    -I StdPeriphLib/inc


build_src_filter =
    +<*.c>
    -<wavetables/>
    +<../StdPeriphLib/src/stm8s_itc.c>
    +<../StdPeriphLib/src/stm8s_clk.c>
    +<../StdPeriphLib/src/stm8s_iwdg.c>
    +<../StdPeriphLib/src/stm8s_gpio.c>
    +<../StdPeriphLib/src/stm8s_exti.c>
    +<../StdPeriphLib/src/stm8s_uart2.c>
    +<../StdPeriphLib/src/stm8s_tim1.c>
    +<../StdPeriphLib/src/stm8s_tim2.c>
    +<../StdPeriphLib/src/stm8s_adc1.c>
    +<../StdPeriphLib/src/stm8s_flash.c>
    